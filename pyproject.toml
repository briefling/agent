[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "briefling-agent"
version = "0.1.0"
description = "A coding agent in a Docker Sandboxes microVM, connected to briefling, in one command"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
briefling-agent = "briefling_agent.cli:main"

[tool.setuptools]
packages = ["briefling_agent"]
